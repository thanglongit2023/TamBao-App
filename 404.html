<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Trang Không Tồn Tại | Tam Bảo Health</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: hsl(220, 30%, 6%);
      --bg-card: hsl(220, 22%, 14%);
      --text-bright: hsl(0, 0%, 98%);
      --text-muted: hsl(220, 12%, 60%);
      --jade: hsl(168, 65%, 38%);
      --gold: hsl(42, 95%, 60%);
      --font-head: 'Outfit', sans-serif;
      --font-body: 'Be Vietnam Pro', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-deep);
      color: var(--text-bright);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .box {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .code {
      font-family: var(--font-head);
      font-size: 5rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--jade), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 12px;
    }
    h1 {
      font-family: var(--font-head);
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, hsl(42,95%,50%), hsl(42,95%,60%));
      color: #0f172a;
      font-family: var(--font-head);
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 12px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(245,158,11,0.3);
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Trang Không Tồn Tại</h1>
    <p>Đường dẫn bạn truy cập không đúng hoặc đã được di chuyển. Hãy quay lại trang chủ để bắt đầu đánh giá sức khỏe Tam Bảo.</p>
    <a href="./" class="btn">☯ Quay Về Trang Chủ</a>
  </div>
</body>
</html>
